<section id="integrations" class="integrations-simple">
    <div class="container">
        <div class="integrations-header animate-on-scroll">
            <span class="section-tag">{{ i18n "integrations_tag" }}</span>
            <h2>{{ i18n "integrations_title" }}</h2>
            <p>{{ i18n "integrations_description" }}</p>
        </div>

        <!-- Simple Icon Row -->
        <div class="integrations-icons animate-on-scroll">
            <div class="integration-icon-item">
                <img src="/images/integrations/stripe.svg" alt="Stripe">
            </div>
            <div class="integration-icon-item">
                <img src="/images/integrations/google-calendar.svg" alt="Google Calendar">
            </div>
            <div class="integration-icon-item">
                <img src="/images/integrations/whatsapp.svg" alt="WhatsApp">
            </div>
        </div>
    </div>
</section>
