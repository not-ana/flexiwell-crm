            <a href="{{ .Site.BaseURL | relLangURL }}" class="footer-logo">
                <span class="footer-logo-text">flexiwell</span>
            </a>
            <nav class="footer-nav-horizontal">
                <a href="{{ "/#ai-features" | relLangURL }}">{{ i18n "nav_features" }}</a>
