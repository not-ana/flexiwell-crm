<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-roadmap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1f54;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#bg-roadmap)"/>

  <!-- Decorative circles -->
  <circle cx="350" cy="60" r="80" fill="white" fill-opacity="0.02"/>
  <circle cx="50" cy="280" r="60" fill="white" fill-opacity="0.02"/>

  <!-- Roadmap timeline -->
  <line x1="80" y1="80" x2="80" y2="260" stroke="white" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Q1 - Completed -->
  <g transform="translate(60, 70)">
    <circle cx="20" cy="20" r="12" fill="#10b981"/>
    <path d="M14 20 L18 24 L26 14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="45" y="5" width="140" height="45" rx="8" fill="white" fill-opacity="0.1"/>
    <text x="115" y="22" text-anchor="middle" fill="white" fill-opacity="0.6" font-family="system-ui, -apple-system, sans-serif" font-size="9">Q4 2025</text>
    <text x="115" y="38" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">WhatsApp Integration</text>
  </g>

  <!-- Q2 - Current -->
  <g transform="translate(60, 130)">
    <circle cx="20" cy="20" r="12" fill="#7c3aed"/>
    <circle cx="20" cy="20" r="6" fill="white"/>
    <rect x="45" y="5" width="160" height="45" rx="8" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-opacity="0.5"/>
    <text x="125" y="22" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="9">Q1 2026 - IN PROGRESS</text>
    <text x="125" y="38" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">AI Smart Scheduling</text>
  </g>

  <!-- Q3 - Upcoming -->
  <g transform="translate(60, 190)">
    <circle cx="20" cy="20" r="12" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.3"/>
    <rect x="45" y="5" width="140" height="45" rx="8" fill="white" fill-opacity="0.08"/>
    <text x="115" y="22" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="9">Q2 2026</text>
    <text x="115" y="38" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Revenue Analytics</text>
  </g>

  <!-- Vote badge -->
  <g transform="translate(250, 70)">
    <rect width="110" height="80" rx="12" fill="white" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="55" y="25" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">YOUR VOTE</text>
    <text x="55" y="45" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11">Decide what</text>
    <text x="55" y="60" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11">we build next</text>
    <!-- Thumb up -->
    <g transform="translate(40, 65)">
      <path d="M15 5 L15 0 L20 0 L20 15 L8 15 L5 8 L10 8 L10 5 Z" fill="#fbbf24" transform="scale(0.8)"/>
    </g>
  </g>

  <!-- Beta access badge -->
  <g transform="translate(250, 170)">
    <rect width="110" height="45" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="55" y="20" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">BETA ACCESS</text>
    <text x="55" y="35" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Try features first</text>
  </g>

  <!-- Advisory board badge -->
  <g transform="translate(250, 230)">
    <rect width="110" height="45" rx="8" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="55" y="20" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">ADVISORY BOARD</text>
    <text x="55" y="35" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Strategy sessions</text>
  </g>
</svg>
