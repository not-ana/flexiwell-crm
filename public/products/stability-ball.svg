  <path d="M110 160 Q200 180 290 160" stroke="#E11D48" stroke-width="1.5" opacity="0.15" fill="none"/>
  <path d="M110 240 Q200 220 290 240" stroke="#E11D48" stroke-width="1.5" opacity="0.15" fill="none"/>
  <!-- Nub on top -->
  <circle cx="200" cy="102" r="5" fill="#BE123C" opacity="0.4"/>
  <defs><linearGradient id="bg" x1="140" y1="120" x2="280" y2="300"><stop stop-color="#FB7185"/><stop offset="1" stop-color="#E11D48"/></linearGradient></defs>
