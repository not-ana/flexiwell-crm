<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#F9FAFB"/>
  <ellipse cx="200" cy="320" rx="80" ry="10" fill="#000" opacity="0.05"/>
  <!-- Ball -->
