<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" rx="12" fill="#1a1a2e"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="70" height="400" fill="#252542"/>
  <rect x="0" y="0" width="70" height="400" rx="12" fill="#252542"/>

  <!-- Sidebar Logo -->
  <rect x="15" y="20" width="40" height="8" rx="4" fill="#7c3aed"/>

  <!-- Sidebar Icons -->
  <rect x="22" y="60" width="26" height="26" rx="6" fill="#7c3aed" fill-opacity="0.2"/>
  <rect x="28" y="68" width="14" height="10" rx="2" fill="#7c3aed"/>

  <rect x="22" y="96" width="26" height="26" rx="6" fill="transparent"/>
  <rect x="28" y="104" width="14" height="10" rx="2" fill="#6b7280"/>

  <rect x="22" y="132" width="26" height="26" rx="6" fill="transparent"/>
  <rect x="28" y="140" width="14" height="10" rx="2" fill="#6b7280"/>

  <rect x="22" y="168" width="26" height="26" rx="6" fill="transparent"/>
  <rect x="28" y="176" width="14" height="10" rx="2" fill="#6b7280"/>

  <!-- User Avatar -->
  <circle cx="35" cy="370" r="16" fill="#7c3aed"/>
  <text x="35" y="375" text-anchor="middle" fill="white" font-size="10" font-family="Arial" font-weight="bold">AS</text>

  <!-- Main Content Area -->
  <rect x="85" y="15" width="500" height="370" rx="8" fill="#f8fafc"/>

  <!-- Header -->
  <text x="105" y="45" fill="#1f2937" font-size="16" font-family="Arial" font-weight="bold">Good morning, Alex</text>
  <rect x="105" y="55" width="120" height="6" rx="3" fill="#e5e7eb"/>

  <!-- Stats Cards Row -->
  <rect x="105" y="75" width="110" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="115" y="95" fill="#6b7280" font-size="9" font-family="Arial">Total Revenue</text>
  <text x="115" y="115" fill="#1f2937" font-size="14" font-family="Arial" font-weight="bold">$24,500</text>
  <text x="115" y="128" fill="#10b981" font-size="8" font-family="Arial">+12.5%</text>

  <rect x="225" y="75" width="110" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="235" y="95" fill="#6b7280" font-size="9" font-family="Arial">Active Clients</text>
  <text x="235" y="115" fill="#1f2937" font-size="14" font-family="Arial" font-weight="bold">248</text>
  <text x="235" y="128" fill="#10b981" font-size="8" font-family="Arial">+18</text>

  <rect x="345" y="75" width="110" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="355" y="95" fill="#6b7280" font-size="9" font-family="Arial">Classes This Month</text>
  <text x="355" y="115" fill="#1f2937" font-size="14" font-family="Arial" font-weight="bold">156</text>
  <text x="355" y="128" fill="#10b981" font-size="8" font-family="Arial">+8%</text>

  <rect x="465" y="75" width="110" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="475" y="95" fill="#6b7280" font-size="9" font-family="Arial">Avg. Attendance</text>
  <text x="475" y="115" fill="#1f2937" font-size="14" font-family="Arial" font-weight="bold">94%</text>
  <text x="475" y="128" fill="#10b981" font-size="8" font-family="Arial">+2.3%</text>

  <!-- Revenue Chart -->
  <rect x="105" y="150" width="280" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="120" y="172" fill="#1f2937" font-size="11" font-family="Arial" font-weight="bold">Revenue Trend</text>
  <text x="120" y="185" fill="#9ca3af" font-size="8" font-family="Arial">Monthly comparison</text>

  <!-- Chart Line -->
  <path d="M130 260 L160 250 L190 245 L220 240 L250 230 L280 235 L310 220 L340 210 L360 215"
        stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 260 L160 250 L190 245 L220 240 L250 230 L280 235 L310 220 L340 210 L360 215 L360 275 L130 275 Z"
        fill="url(#gradient1)" opacity="0.3"/>

  <!-- Chart X-axis labels -->
  <text x="130" y="285" fill="#9ca3af" font-size="7" font-family="Arial">Jan</text>
  <text x="175" y="285" fill="#9ca3af" font-size="7" font-family="Arial">Mar</text>
  <text x="220" y="285" fill="#9ca3af" font-size="7" font-family="Arial">May</text>
  <text x="265" y="285" fill="#9ca3af" font-size="7" font-family="Arial">Jul</text>
  <text x="310" y="285" fill="#9ca3af" font-size="7" font-family="Arial">Sep</text>
  <text x="350" y="285" fill="#9ca3af" font-size="7" font-family="Arial">Nov</text>

  <!-- Pie Chart -->
  <rect x="400" y="150" width="175" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="415" y="172" fill="#1f2937" font-size="11" font-family="Arial" font-weight="bold">Class Distribution</text>

  <!-- Simple Pie -->
  <circle cx="490" cy="230" r="35" fill="#e5e7eb"/>
  <path d="M490 195 A35 35 0 0 1 525 230 L490 230 Z" fill="#7c3aed"/>
  <path d="M525 230 A35 35 0 0 1 490 265 L490 230 Z" fill="#a78bfa"/>
  <path d="M490 265 A35 35 0 0 1 455 230 L490 230 Z" fill="#c4b5fd"/>
  <path d="M455 230 A35 35 0 0 1 490 195 L490 230 Z" fill="#ddd6fe"/>

  <!-- Legend -->
  <circle cx="420" cy="280" r="4" fill="#7c3aed"/>
  <text x="428" y="283" fill="#6b7280" font-size="7" font-family="Arial">Pilates 45%</text>
  <circle cx="480" cy="280" r="4" fill="#a78bfa"/>
  <text x="488" y="283" fill="#6b7280" font-size="7" font-family="Arial">Yoga 25%</text>

  <!-- Staff Performance Table -->
  <rect x="105" y="305" width="280" height="70" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="120" y="325" fill="#1f2937" font-size="11" font-family="Arial" font-weight="bold">Staff Performance</text>

  <!-- Table Header -->
  <text x="120" y="342" fill="#9ca3af" font-size="7" font-family="Arial">STAFF</text>
  <text x="200" y="342" fill="#9ca3af" font-size="7" font-family="Arial">CLASSES</text>
  <text x="250" y="342" fill="#9ca3af" font-size="7" font-family="Arial">RATING</text>
  <text x="310" y="342" fill="#9ca3af" font-size="7" font-family="Arial">TREND</text>

  <!-- Table Row 1 -->
  <circle cx="130" cy="358" r="8" fill="#7c3aed"/>
  <text x="130" y="361" text-anchor="middle" fill="white" font-size="6" font-family="Arial">SJ</text>
  <text x="142" y="361" fill="#1f2937" font-size="8" font-family="Arial">Sarah Johnson</text>
  <text x="205" y="361" fill="#1f2937" font-size="8" font-family="Arial">24</text>
  <text x="255" y="361" fill="#1f2937" font-size="8" font-family="Arial">4.9</text>
  <text x="310" y="361" fill="#10b981" font-size="8" font-family="Arial">↑ Up</text>

  <!-- Attendance Card -->
  <rect x="400" y="305" width="175" height="70" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="415" y="325" fill="#1f2937" font-size="11" font-family="Arial" font-weight="bold">Attendance Trend</text>
  <text x="415" y="340" fill="#9ca3af" font-size="8" font-family="Arial">Last 8 weeks</text>

  <!-- Mini trend line -->
  <path d="M420 360 L445 355 L470 358 L495 350 L520 352 L545 345 L560 348"
        stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>

  <text x="530" y="368" fill="#10b981" font-size="12" font-family="Arial" font-weight="bold">93.3%</text>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>