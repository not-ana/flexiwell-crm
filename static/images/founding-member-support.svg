<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-support" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1f54;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#bg-support)"/>

  <!-- Decorative circles -->
  <circle cx="320" cy="80" r="100" fill="white" fill-opacity="0.02"/>
  <circle cx="80" cy="260" r="70" fill="white" fill-opacity="0.02"/>

  <!-- Chat bubbles container -->
  <g transform="translate(50, 50)">
    <!-- User message -->
    <rect x="120" y="0" width="180" height="50" rx="12" fill="white" fill-opacity="0.15"/>
    <rect x="120" y="0" width="180" height="50" rx="12" fill="none" stroke="white" stroke-opacity="0.2"/>
    <text x="210" y="22" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif" font-size="11">Need help with booking</text>
    <text x="210" y="38" text-anchor="middle" fill="white" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif" font-size="11">integration...</text>
    <!-- User avatar -->
    <circle cx="280" cy="70" r="16" fill="#7c3aed"/>
    <text x="280" y="75" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Y</text>

    <!-- Support response -->
    <rect x="0" y="80" width="200" height="70" rx="12" fill="#10b981"/>
    <text x="100" y="102" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Hi! I'm here to help.</text>
    <text x="100" y="118" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Let me walk you through</text>
    <text x="100" y="134" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">the setup right now!</text>
    <!-- Support avatar -->
    <circle cx="20" cy="170" r="16" fill="#10b981"/>
    <text x="20" y="175" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">FW</text>
  </g>

  <!-- Response time badge -->
  <g transform="translate(240, 180)">
    <rect width="120" height="40" rx="20" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
    <text x="60" y="20" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="9">Response time</text>
    <text x="60" y="33" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">&lt; 30 min</text>
  </g>

  <!-- Slack icon indicator -->
  <g transform="translate(60, 240)">
    <rect width="100" height="32" rx="8" fill="white" fill-opacity="0.1"/>
    <rect x="12" y="8" width="16" height="16" rx="4" fill="#e01e5a"/>
    <rect x="12" y="8" width="7" height="7" rx="2" fill="#36c5f0"/>
    <rect x="21" y="8" width="7" height="7" rx="2" fill="#2eb67d"/>
    <rect x="21" y="17" width="7" height="7" rx="2" fill="#ecb22e"/>
    <text x="60" y="21" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Direct Slack</text>
  </g>

  <!-- VIP badge -->
  <g transform="translate(280, 240)">
    <rect width="70" height="32" rx="8" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="35" y="17" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9">VIP</text>
    <text x="35" y="27" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="8">SUPPORT</text>
  </g>

  <!-- Online indicator dots -->
  <circle cx="85" cy="205" r="5" fill="#10b981"/>
  <circle cx="85" cy="205" r="8" fill="#10b981" fill-opacity="0.3"/>
</svg>
