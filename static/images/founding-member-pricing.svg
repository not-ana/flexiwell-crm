<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-pricing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1f54;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="url(#bg-pricing)"/>

  <!-- Decorative circles -->
  <circle cx="350" cy="50" r="80" fill="white" fill-opacity="0.02"/>
  <circle cx="50" cy="280" r="60" fill="white" fill-opacity="0.02"/>

  <!-- Main price card -->
  <rect x="100" y="60" width="200" height="200" rx="16" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>

  <!-- Price badge at top -->
  <rect x="130" y="40" width="140" height="36" rx="18" fill="#10b981"/>
  <text x="200" y="64" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">50% OFF</text>

  <!-- Crossed out price -->
  <text x="200" y="115" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-decoration="line-through">$99/mo</text>

  <!-- Main price -->
  <text x="200" y="160" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800">$49</text>
  <text x="200" y="185" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="14">/month forever</text>

  <!-- Lock icon -->
  <g transform="translate(175, 200)">
    <rect x="5" y="12" width="40" height="30" rx="4" fill="#fbbf24"/>
    <path d="M15 12 V8 C15 4 20 0 25 0 C30 0 35 4 35 8 V12" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <circle cx="25" cy="27" r="4" fill="#1a1033"/>
  </g>

  <!-- Locked price text -->
  <text x="200" y="260" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">PRICE LOCKED FOREVER</text>

  <!-- Floating benefit badges -->
  <g transform="translate(30, 100)">
    <rect width="60" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="30" y="16" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">No fees</text>
  </g>

  <g transform="translate(310, 120)">
    <rect width="70" height="24" rx="12" fill="#7c3aed" fill-opacity="0.3"/>
    <text x="35" y="16" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Free upgrades</text>
  </g>

  <g transform="translate(40, 220)">
    <rect width="55" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="27" y="16" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Cancel any</text>
  </g>

  <!-- Sparkles -->
  <g fill="#fbbf24">
    <polygon points="60,60 62,66 68,66 63,70 65,76 60,72 55,76 57,70 52,66 58,66" opacity="0.8"/>
    <polygon points="340,180 341,184 345,184 342,186 343,190 340,188 337,190 338,186 335,184 339,184" opacity="0.6"/>
    <polygon points="85,170 86,173 89,173 87,175 88,178 85,176 82,178 83,175 80,173 84,173" opacity="0.5"/>
  </g>
</svg>
