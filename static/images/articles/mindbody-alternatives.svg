<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-mb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1033;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#261B53;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2d6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-mb)"/>

  <!-- Subtle decorative circles -->
  <circle cx="700" cy="100" r="100" fill="white" fill-opacity="0.02"/>
  <circle cx="100" cy="350" r="80" fill="white" fill-opacity="0.02"/>

  <!-- MindBody crossed out card -->
  <g transform="translate(80, 120)">
    <rect width="200" height="160" rx="16" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15"/>

    <!-- MindBody Logo style -->
    <g transform="translate(50, 25)">
      <rect width="100" height="28" rx="4" fill="#00a4bd"/>
      <text x="50" y="19" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">MINDBODY</text>
    </g>

    <text x="100" y="85" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">$129+/month</text>
    <text x="100" y="110" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="12">Complex interface</text>
    <text x="100" y="130" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="12">High transaction fees</text>
    <text x="100" y="150" text-anchor="middle" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="12">No AI automation</text>

    <!-- Red X overlay -->
    <line x1="25" y1="25" x2="175" y2="135" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="175" y1="25" x2="25" y2="135" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(300, 195)">
    <path d="M0 15 L70 15" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M58 5 L70 15 L58 25" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Top 10 badge -->
  <g transform="translate(60, 60)">
    <rect width="85" height="38" rx="8" fill="white"/>
    <text x="42" y="25" text-anchor="middle" fill="#7c3aed" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">TOP 10</text>
  </g>

  <!-- Alternatives grid -->
  <g transform="translate(390, 95)">
    <!-- Card 1 - FlexiWell (highlighted) -->
    <rect x="0" y="0" width="170" height="90" rx="12" fill="white" fill-opacity="0.12" stroke="#10b981" stroke-width="2"/>
    <g transform="translate(12, 15)">
      <rect width="85" height="26" rx="5" fill="#7c3aed"/>
      <text x="42" y="18" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">FlexiWell</text>
    </g>
    <text x="85" y="60" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">AI-powered</text>
    <text x="85" y="78" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">$49/mo</text>

    <!-- Card 2 - Momence -->
    <rect x="185" y="0" width="170" height="90" rx="12" fill="white" fill-opacity="0.08"/>
    <g transform="translate(197, 15)">
      <rect width="85" height="26" rx="5" fill="#5046e5"/>
      <text x="42" y="18" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Momence</text>
    </g>
    <text x="270" y="60" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Booking focused</text>
    <text x="270" y="78" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">$99/mo</text>

    <!-- Card 3 - WellnessLiving -->
    <rect x="0" y="105" width="170" height="90" rx="12" fill="white" fill-opacity="0.08"/>
    <g transform="translate(12, 120)">
      <rect width="115" height="26" rx="5" fill="#0891b2"/>
      <text x="57" y="18" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">WellnessLiving</text>
    </g>
    <text x="85" y="165" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="11">All-in-one</text>
    <text x="85" y="183" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">$89/mo</text>

    <!-- Card 4 - Glofox -->
    <rect x="185" y="105" width="170" height="90" rx="12" fill="white" fill-opacity="0.08"/>
    <g transform="translate(197, 120)">
      <rect width="85" height="26" rx="5" fill="#ff6b35"/>
      <text x="42" y="18" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">glofox</text>
    </g>
    <text x="270" y="165" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Gym focused</text>
    <text x="270" y="183" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">~$110/mo</text>
  </g>

  <!-- +6 more badge -->
  <circle cx="720" cy="275" r="38" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
  <text x="720" y="268" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">+6</text>
  <text x="720" y="288" text-anchor="middle" fill="white" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="12">more</text>

  <!-- Bottom text -->
  <text x="400" y="395" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill-opacity="0.95">Best MindBody Alternatives 2026</text>
</svg>
