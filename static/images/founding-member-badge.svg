<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="140" cy="140" r="130" fill="none" stroke="url(#goldRing)" stroke-width="2"/>

  <!-- Inner ring -->
  <circle cx="140" cy="140" r="115" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.4"/>

  <!-- Center content background -->
  <circle cx="140" cy="140" r="100" fill="#0f0a1e"/>

  <!-- Simple crown/star icon -->
  <path d="M140 60 L148 85 L175 85 L154 102 L162 130 L140 115 L118 130 L126 102 L105 85 L132 85 Z" fill="url(#goldRing)"/>

  <!-- Text: FOUNDING -->
  <text x="140" y="165" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FOUNDING</text>

  <!-- Text: MEMBER -->
  <text x="140" y="188" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="3">MEMBER</text>

  <!-- Subtle line -->
  <line x1="90" y1="205" x2="190" y2="205" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>

  <!-- Number -->
  <text x="140" y="225" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">#001 of 5</text>
</svg>
