# ============ FAQ SECTION ============
faq_title:
  other: "Frequently asked questions"
faq_subtitle:
  other: "Everything you need to know about the product and billing."

faq_q1:
  other: "How do I import clients from Mindbody, Glofox, or other systems?"
faq_a1:
  other: "FlexiWell makes migration easy with built-in import tools. Go to Settings > Data Migration and select your previous platform (Mindbody, Glofox, or Tecnofit). You can upload an exported CSV from your old system, and our importer will automatically map client names, contact info, membership plans, and booking history. A preview screen lets you review and fix any issues before confirming. For complex migrations, our Assisted Migration Service ($299 USD one-time) provides hands-on support from our team."

faq_q2:
  other: "How does the waitlist priority system work?"
faq_a2:
  other: "Our Smart Waitlist ranks clients automatically based on multiple factors: Plan type – Annual students get higher priority than drop-in pass holders. Client source – Direct clients get priority over aggregators (Wellhub, ClassPass). Attendance history – Clients with better attendance rates move up the list. Wait time – The longer someone has been waiting, the higher their priority. When a spot opens, the highest-priority client is notified instantly via SMS. They have a configurable time window to confirm before the spot goes to the next person. You can also manually assign VIP status to special clients."

faq_q3:
  other: "What can the AI support assistant do?"
faq_a3:
  other: "The AI assistant handles common client inquiries 24/7 via SMS, email, and web chat. It can check available classes and schedules, book or cancel classes for clients, answer questions about membership plans, check payment status and due dates, report waitlist position, recommend classes based on preferences, and answer FAQs about your studio. When needed, conversations escalate to human support. You can customize the assistant's tone (professional, friendly, casual, or enthusiastic) to match your brand."

faq_q4:
  other: "What payment methods are accepted?"
faq_a4:
  other: "FlexiWell supports multiple payment options: Credit/debit cards via Stripe integration, Bank transfer for clients who prefer manual payments, and Cash for recording in-person payments manually. You can set up recurring billing for subscriptions, send automatic payment reminders, and generate invoices and receipts. All transactions are tracked in a dashboard with detailed reporting."

faq_q5:
  other: "How do I connect with Wellhub (Gympass)?"
faq_a5:
  other: "Go to Settings > Integrations > Wellhub and click Connect. You'll enter your Wellhub partner credentials, and FlexiWell will sync automatically. Once connected: Your classes appear in the Wellhub app, Wellhub check-ins are recorded in your system, Revenue reports show Wellhub bookings separately, and waitlist priority distinguishes Wellhub clients from direct members. The same process works for ClassPass, TotalPass, and Urban Sports Club. This lets you expand your reach while keeping all bookings centralized in FlexiWell."

