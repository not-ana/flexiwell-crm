# ============ FAQ SECTION ============
faq_title:
  other: "Preguntas frecuentes"
faq_subtitle:
  other: "Todo lo que necesitas saber sobre el producto y facturación."

faq_q1:
  other: "¿Cómo importo clientes de Mindbody, Glofox u otros sistemas?"
faq_a1:
  other: "FlexiWell facilita la migración con herramientas de importación integradas. Ve a Configuración > Migración de Datos y selecciona tu plataforma anterior (Mindbody, Glofox o Tecnofit). Puedes subir un CSV exportado de tu sistema anterior, y nuestro importador mapeará automáticamente nombres de clientes, información de contacto, planes de membresía e historial de reservas. Una pantalla de vista previa te permite revisar y corregir problemas antes de confirmar. Para migraciones complejas, nuestro Servicio de Migración Asistida ($299 USD único) ofrece soporte hands-on de nuestro equipo."

faq_q2:
  other: "¿Cómo funciona el sistema de prioridad de lista de espera?"
faq_a2:
  other: "Nuestra Lista de Espera Inteligente clasifica clientes automáticamente basándose en múltiples factores: Tipo de plan – Alumnos anuales tienen mayor prioridad que los de pase único. Origen del cliente – Clientes directos tienen prioridad sobre agregadores (Wellhub, ClassPass). Historial de asistencia – Clientes con mejor tasa de asistencia suben en la lista. Tiempo de espera – Entre más tiempo esperando, mayor prioridad. Cuando un lugar se abre, el cliente de mayor prioridad es notificado instantáneamente vía WhatsApp. Tiene un tiempo configurable para confirmar antes de que el lugar vaya al siguiente. También puedes asignar estatus VIP manualmente para clientes especiales."

faq_q3:
  other: "¿Qué puede hacer el asistente de soporte con IA?"
faq_a3:
  other: "El asistente IA atiende consultas comunes de clientes 24/7 vía WhatsApp, email y chat web. Puede verificar clases y horarios disponibles, agendar o cancelar clases para clientes, responder preguntas sobre planes de membresía, verificar estado de pago y fechas de vencimiento, informar posición en lista de espera, recomendar clases basadas en preferencias y responder FAQs sobre tu estudio. Cuando es necesario, las conversaciones se escalan a soporte humano. Puedes personalizar el tono del asistente (profesional, amigable, casual o entusiasta) para que coincida con tu marca."

faq_q4:
  other: "¿Qué métodos de pago se aceptan?"
faq_a4:
  other: "FlexiWell soporta múltiples opciones de pago: Tarjetas de crédito/débito vía integración Stripe, Transferencia bancaria para clientes que prefieren pagos manuales, y Efectivo para registrar pagos presenciales manualmente. Puedes configurar cobros recurrentes para suscripciones, enviar recordatorios automáticos de pago y generar facturas y recibos. Todas las transacciones se rastrean en un panel con reportes detallados."

faq_q5:
  other: "¿Cómo me conecto con Wellhub (Gympass)?"
faq_a5:
  other: "Ve a Configuración > Integraciones > Wellhub y haz clic en Conectar. Ingresarás tus credenciales de socio Wellhub, y FlexiWell sincronizará automáticamente. Una vez conectado: Tus clases aparecen en la app Wellhub, Check-ins de Wellhub se registran en tu sistema, Reportes de ingresos muestran reservas Wellhub por separado, y la prioridad de lista de espera distingue clientes Wellhub de miembros directos. El mismo proceso funciona para ClassPass, TotalPass y Urban Sports Club. Esto te permite expandir tu alcance manteniendo todas las reservas centralizadas en FlexiWell."

