# ============ FAQ SECTION ============
faq_title:
  other: "Perguntas frequentes"
faq_subtitle:
  other: "Tudo que você precisa saber sobre o produto e cobrança."

faq_q1:
  other: "Como importo clientes do Mindbody, Glofox ou outros sistemas?"
faq_a1:
  other: "O FlexiWell facilita a migração com ferramentas de importação integradas. Vá em Configurações > Migração de Dados e selecione sua plataforma anterior (Mindbody, Glofox ou Tecnofit). Você pode fazer upload de um CSV exportado do seu sistema antigo, e nosso importador mapeará automaticamente nomes de clientes, informações de contato, planos de assinatura e histórico de reservas. Uma tela de prévia permite revisar e corrigir problemas antes de confirmar. Para migrações complexas, nosso Serviço de Migração Assistida (R$ 1.499 único) oferece suporte hands-on da nossa equipe."

faq_q2:
  other: "Como funciona o sistema de prioridade da lista de espera?"
faq_a2:
  other: "Nossa Lista de Espera Inteligente classifica clientes automaticamente com base em múltiplos fatores: Tipo de plano – Alunos anuais têm maior prioridade que os de aula avulsa. Origem do cliente – Clientes diretos têm prioridade sobre agregadores (Wellhub, TotalPass). Histórico de presença – Clientes com melhor taxa de presença sobem na lista. Tempo de espera – Quanto mais tempo esperando, maior a prioridade. Quando uma vaga abre, o cliente de maior prioridade é notificado instantaneamente via WhatsApp. Ele tem um tempo configurável para confirmar antes da vaga ir para o próximo. Você também pode atribuir status VIP manualmente para clientes especiais."

faq_q3:
  other: "O que o assistente de suporte com IA pode fazer?"
faq_a3:
  other: "O assistente IA atende consultas comuns de clientes 24/7 via WhatsApp, email e chat web. Ele pode verificar aulas e horários disponíveis, agendar ou cancelar aulas para clientes, responder perguntas sobre planos de assinatura, verificar status de pagamento e datas de vencimento, informar posição na lista de espera, recomendar aulas baseadas em preferências e responder FAQs sobre seu estúdio. Quando necessário, as conversas são escaladas para suporte humano. Você pode personalizar o tom do assistente (profissional, amigável, casual ou entusiasmado) para combinar com sua marca."

faq_q4:
  other: "Quais métodos de pagamento são aceitos?"
faq_a4:
  other: "O FlexiWell suporta múltiplas opções de pagamento: Cartões de crédito/débito via integração Stripe, PIX para pagamentos instantâneos, Transferência bancária para clientes que preferem pagamentos manuais, e Dinheiro para registrar pagamentos presenciais manualmente. Você pode configurar cobranças recorrentes para assinaturas, enviar lembretes automáticos de pagamento e gerar notas fiscais e recibos. Todas as transações são rastreadas em um painel com relatórios detalhados."

faq_q5:
  other: "Como me conecto com o Wellhub (Gympass)?"
faq_a5:
  other: "Vá em Configurações > Integrações > Wellhub e clique em Conectar. Você vai inserir suas credenciais de parceiro Wellhub, e o FlexiWell sincronizará automaticamente. Uma vez conectado: Suas aulas aparecem no app Wellhub, Check-ins do Wellhub são registrados no seu sistema, Relatórios de receita mostram reservas Wellhub separadamente, e a prioridade da lista de espera distingue clientes Wellhub de membros diretos. O mesmo processo funciona para TotalPass e outros agregadores. Isso permite expandir seu alcance mantendo todas as reservas centralizadas no FlexiWell."

